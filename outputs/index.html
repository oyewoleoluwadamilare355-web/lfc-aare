<!-- FIREBASE FCM PUSH NOTIFICATION REGISTRATION -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";
  import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD9pPgstjk61L591zdlcn2f7OaypP3mPgA",
    authDomain: "kingmegad-30f67.firebaseapp.com",
    projectId: "kingmegad-30f67",
    storageBucket: "kingmegad-30f67.firebasestorage.app",
    messagingSenderId: "81567062415",
    appId: "1:81567062415:web:8ba053c67b05cdfea5d3fa"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const messaging = getMessaging(app);

  // VAPID Public Key from Firebase Console (Project Settings -> Cloud Messaging -> Web Push Certificates)
  const VAPID_KEY = "YOUR_PUBLIC_VAPID_KEY_HERE";

  async function requestNotificationPermission() {
    try {
      const permission = await Notification.requestPermission();
      if (permission === 'granted') {
        const token = await getToken(messaging, { 
          vapidKey: VAPID_KEY,
          serviceWorkerRegistration: await navigator.serviceWorker.ready
        });

        if (token) {
          // Save or update the device token in Firestore
          await setDoc(doc(db, "fcm_tokens", token), {
            token: token,
            device: navigator.userAgent,
            updatedAt: serverTimestamp()
          });
          console.log("FCM Token registered successfully.");
        }
      }
    } catch (error) {
      console.warn("Push Notification registration failed:", error);
    }
  }

  // Trigger permission prompt after Service Worker is ready
  if ('serviceWorker' in navigator && 'PushManager' in window) {
    navigator.serviceWorker.ready.then(() => {
      // Delay prompt slightly so as not to interrupt immediate page load
      setTimeout(requestNotificationPermission, 3000);
    });
  }

  // Listen for foreground notifications when the app is actively open
  onMessage(messaging, (payload) => {
    if (Notification.permission === 'granted') {
      new Notification(payload.notification.title, {
        body: payload.notification.body,
        icon: './logo.png'
      });
    }
  });
</script>
