<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Announcements | LFC Aare</title>
  <link rel="icon" type="image/png" href="./app-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #10221d;
      --forest: #124b3a;
      --paper: #f7f5ef;
      --line: rgba(16, 34, 29, 0.15);
      --red: #e52421;
      --card-bg: #ffffff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "DM Sans", sans-serif; }
    a { color: inherit; text-decoration: none; }

    /* HEADER & NAVIGATION */
    header { background: var(--forest); color: #fff; padding: 16px 24px; position: relative; z-index: 100; }
    .header-container { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo { height: 42px; width: auto; object-fit: contain; background: #fff; padding: 4px; border-radius: 50%; }
    .brand-title { font-weight: 700; font-size: 1rem; line-height: 1.2; color: #fff; }
    .brand-subtitle { font-size: 0.75rem; opacity: 0.8; display: block; }

    .menu-toggle {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
    }

    nav { display: none; flex-direction: column; width: 100%; background: #0d382b; padding: 16px 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); margin-top: 14px; gap: 12px; }
    nav.active { display: flex; }
    nav a { font-size: 0.95rem; font-weight: 500; color: #e0f2ec; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    nav a:last-child { border-bottom: none; }

    @media (min-width: 900px) {
      .menu-toggle { display: none; }
      nav { display: flex !important; flex-direction: row; width: auto; background: transparent; padding: 0; margin-top: 0; border-top: none; align-items: center; gap: 18px; }
      nav a { padding: 0; border-bottom: none; }
    }

    /* MAIN CONTAINER & DASHBOARD CARDS */
    .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .admin-badge { font: 600 0.75rem "DM Mono", monospace; color: var(--red); letter-spacing: 1.5px; text-transform: uppercase; }
    h1 { font-family: "Playfair Display", serif; font-size: 2.2rem; margin: 6px 0 24px; }

    .card { background: var(--card-bg); border: 1px solid var(--line); border-radius: 8px; padding: 24px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .card h2 { font-family: "Playfair Display", serif; font-size: 1.4rem; margin-top: 0; margin-bottom: 18px; }

    /* FORM STYLES */
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 6px;
      font-family: inherit; font-size: 0.95rem; background: #faf9f6;
    }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--forest); background: #fff; }
    
    .btn-submit {
      background: var(--forest); color: #fff; border: none; padding: 12px 20px;
      font-weight: 700; font-size: 0.95rem; border-radius: 6px; cursor: pointer; transition: background 0.2s;
    }
    .btn-submit:hover { background: #0d382b; }

    /* TABLE STYLES */
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--line); }
    th { background: #f0ece1; font-weight: 700; }
    .btn-delete { background: var(--red); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 0.8rem; }

    footer { background: var(--ink); color: #8a9e97; padding: 40px; text-align: center; font-size: 0.85rem; margin-top: 60px; }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="brand">
        <img class="brand-logo" src="https://upload.wikimedia.org/wikipedia/commons/2/29/Winners_Chapel_Logo.png" alt="LFC Logo" />
        <div>
          <span class="brand-title">LIVING FAITH CHURCH</span>
          <span class="brand-subtitle">ADMIN DASHBOARD</span>
        </div>
      </div>
      <button class="menu-toggle" id="menuBtn" aria-label="Toggle Navigation">
        <span>Menu</span> &#9776;
      </button>
    </div>

    <nav id="navMenu">
      <a href="./index.html">Live Site</a>
      <a href="./admin-announcements.html">Manage Announcements</a>
      <a href="./admin-book.html">Manage Book of Month</a>
      <a href="./wsf-outline.html">WSF Outline</a>
      <a href="./testimonies.html">Testimonies</a>
    </nav>
  </header>

  <main class="container">
    <span class="admin-badge">Control Panel</span>
    <h1>Announcements Management</h1>

    <!-- ADD ANNOUNCEMENT FORM -->
    <div class="card">
      <h2>Post New Announcement</h2>
      <form id="announcementForm">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="e.g., Special Anointing Service" required />
        </div>
        <div class="form-group">
          <label for="date">Date / Schedule</label>
          <input type="text" id="date" placeholder="e.g., Sunday, October 11, 2026" required />
        </div>
        <div class="form-group">
          <label for="content">Announcement Details</label>
          <textarea id="content" rows="4" placeholder="Enter full details of the announcement..." required></textarea>
        </div>
        <button type="submit" id="submitBtn" class="btn-submit">Publish Announcement</button>
      </form>
    </div>

    <!-- EXISTING ANNOUNCEMENTS LIST -->
    <div class="card">
      <h2>Active Announcements</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="announcementList">
            <tr><td colspan="3">Loading announcements...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Living Faith Church (LFC Aare) Admin Portal.</p>
  </footer>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      deleteDoc, 
      doc, 
      serverTimestamp,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Config Integrated
    const firebaseConfig = {
      apiKey: "AIzaSyD9pPgstjk61L591zdlcn2f7OaypP3mPgA",
      authDomain: "kingmegad-30f67.firebaseapp.com",
      projectId: "kingmegad-30f67",
      storageBucket: "kingmegad-30f67.firebasestorage.app",
      messagingSenderId: "81567062415",
      appId: "1:81567062415:web:8ba053c67b05cdfea5d3fa",
      measurementId: "G-BVX8SEWFD0"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // UI Elements
    const form = document.getElementById('announcementForm');
    const announcementList = document.getElementById('announcementList');
    const submitBtn = document.getElementById('submitBtn');

    // Menu toggle logic
    document.getElementById('menuBtn').addEventListener('click', () => {
      document.getElementById('navMenu').classList.toggle('active');
    });

    // 1. ADD ANNOUNCEMENT TO FIRESTORE
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerText = "Publishing...";

      try {
        await addDoc(collection(db, "announcements"), {
          title: document.getElementById('title').value.trim(),
          date: document.getElementById('date').value.trim(),
          content: document.getElementById('content').value.trim(),
          createdAt: serverTimestamp()
        });

        form.reset();
        alert("Announcement published successfully!");
      } catch (error) {
        console.error("Error adding document: ", error);
        alert("Failed to publish announcement. Check console.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Publish Announcement";
      }
    });

    // 2. FETCH & LISTEN TO REAL-TIME ANNOUNCEMENTS
    const q = query(collection(db, "announcements"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      if (snapshot.empty) {
        announcementList.innerHTML = '<tr><td colspan="3">No announcements found.</td></tr>';
        return;
      }

      announcementList.innerHTML = '';
      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${data.title || ''}</strong></td>
          <td>${data.date || ''}</td>
          <td>
            <button class="btn-delete" data-id="${docSnap.id}">Delete</button>
          </td>
        `;
        announcementList.appendChild(tr);
      });
    }, (error) => {
      console.error("Error fetching announcements: ", error);
      announcementList.innerHTML = '<tr><td colspan="3">Error loading data.</td></tr>';
    });

    // 3. DELETE ANNOUNCEMENT FROM FIRESTORE
    announcementList.addEventListener('click', async (e) => {
      if (e.target.classList.contains('btn-delete')) {
        const id = e.target.getAttribute('data-id');
        if (confirm("Are you sure you want to delete this announcement?")) {
          try {
            await deleteDoc(doc(db, "announcements", id));
          } catch (error) {
            console.error("Error deleting announcement: ", error);
            alert("Failed to delete record.");
          }
        }
      }
    });
  </script>
</body>
</html>
