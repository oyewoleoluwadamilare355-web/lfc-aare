<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LFC Aare | Hymn Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink: #10221d; --forest: #124b3a; --paper: #f7f5ef; --line: rgba(16, 34, 29, 0.2); }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "DM Sans", sans-serif; }
    .wrap { width: min(700px, calc(100% - 40px)); margin: auto; padding: 65px 0; }
    .eyebrow, label { font: 500 0.68rem "DM Mono", monospace; text-transform: uppercase; letter-spacing: 0.09em; }
    .eyebrow { color: #217754; }
    h1 { margin: 15px 0; font: 600 clamp(2.7rem, 7vw, 4.3rem) / 0.94 "Playfair Display", serif; letter-spacing: -0.06em; }
    p { line-height: 1.55; color: #40574f; }
    .card { padding: 28px; background: #fff; border: 1px solid var(--line); margin-top: 32px; }
    .hidden { display: none; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .full { grid-column: 1 / -1; }
    input, textarea { padding: 12px; border: 1px solid var(--line); font: 400 0.92rem "DM Sans", sans-serif; }
    textarea { resize: vertical; min-height: 120px; font-family: inherit; }
    button { margin-top: 18px; padding: 14px; border: 0; background: var(--ink); color: #fff; font: 700 0.9rem "DM Sans", sans-serif; cursor: pointer; }
    .status { min-height: 22px; margin: 12px 0 0; font-size: 0.84rem; }
    .error { color: #a42716; }
    .success { color: #16734b; }
    .hymn-list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--line); }
    .hymn-list-item:last-child { border-bottom: none; }
    .btn-delete { background: #a42716; padding: 6px 12px; margin: 0; font-size: 0.75rem; border-radius: 4px; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">LFC Aare Church</div>
    <h1>Hymn Manager</h1>
    <p>Publish and manage the hymn list for this week’s service.</p>

    <section class="card" id="loginPanel">
      <form id="loginForm">
        <div class="grid">
          <div class="field full">
            <label for="email">Studio email</label>
            <input id="email" type="email" required />
          </div>
          <div class="field full">
            <label for="password">Password</label>
            <input id="password" type="password" required />
          </div>
        </div>
        <button type="submit">Sign in</button>
        <p class="status" id="loginStatus"></p>
      </form>
    </section>

    <section class="card hidden" id="hymnPanel">
      <form id="hymnForm">
        <div class="grid">
          <div class="field">
            <label for="number">Hymn number</label>
            <input id="number" required placeholder="e.g. 1" />
          </div>
          <div class="field">
            <label for="position">Display order</label>
            <input id="position" type="number" min="1" required placeholder="e.g. 1" />
          </div>
          <div class="field full">
            <label for="title">Hymn title</label>
            <input id="title" required />
          </div>
          <div class="field full">
            <label for="author">Writer or source (optional)</label>
            <input id="author" />
          </div>
          <div class="field full">
            <label for="lyrics">Hymn Lyrics / Verses (optional)</label>
            <textarea id="lyrics" placeholder="Paste hymn verses here..."></textarea>
          </div>
        </div>
        <button type="submit">Publish hymn</button>
        <p class="status" id="hymnStatus"></p>
      </form>

      <hr style="margin: 30px 0; border: none; border-top: 1px solid var(--line);" />

      <h3>Manage / Delete Published Hymns</h3>
      <div id="adminHymnList">Loading...</div>
    </section>
  </main>

  <script type="module">
    import { firebaseConfig, adminEmails } from './firebase-config.js';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getFirestore, collection, addDoc, doc, deleteDoc, query, orderBy, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const login = document.getElementById('loginPanel');
    const panel = document.getElementById('hymnPanel');
    const status = document.getElementById('loginStatus');
    const hymnStatus = document.getElementById('hymnStatus');
    const adminHymnList = document.getElementById('adminHymnList');

    onAuthStateChanged(auth, user => {
      const isAllowed = user && Array.isArray(adminEmails) && adminEmails.includes(user.email);
      login.classList.toggle('hidden', !!isAllowed);
      panel.classList.toggle('hidden', !isAllowed);

      if (user && !isAllowed) {
        signOut(auth);
        status.textContent = 'This account is not permitted.';
        status.className = 'status error';
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      status.textContent = '';
      try {
        await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
      } catch (err) {
        status.textContent = 'Sign-in failed: ' + err.message;
        status.className = 'status error';
      }
    });

    document.getElementById('hymnForm').addEventListener('submit', async e => {
      e.preventDefault();
      const formElement = e.target;
      hymnStatus.textContent = 'Publishing...';
      hymnStatus.className = 'status';

      try {
        await addDoc(collection(db, 'hymns'), {
          number: document.getElementById('number').value.trim(),
          position: Number(document.getElementById('position').value),
          title: document.getElementById('title').value.trim(),
          author: document.getElementById('author').value.trim(),
          lyrics: document.getElementById('lyrics').value.trim(),
          publishedAt: serverTimestamp()
        });
        
        formElement.reset();
        hymnStatus.textContent = 'Hymn published successfully!';
        hymnStatus.className = 'status success';
      } catch (err) {
        hymnStatus.textContent = `Error (${err.code || 'failed'}): ${err.message}`;
        hymnStatus.className = 'status error';
      }
    });

    const q = query(collection(db, 'hymns'), orderBy('position', 'asc'));
    onSnapshot(q, snapshot => {
      if (snapshot.empty) {
        adminHymnList.innerHTML = '<p>No hymns currently published.</p>';
        return;
      }

      adminHymnList.innerHTML = '';
      snapshot.forEach(hymnDoc => {
        const data = hymnDoc.data();
        const item = document.createElement('div');
        item.className = 'hymn-list-item';
        
        item.innerHTML = `
          <div>
            <strong>Hymn ${data.number}:</strong> ${data.title}
          </div>
          <button class="btn-delete" data-id="${hymnDoc.id}">Delete</button>
        `;

        item.querySelector('.btn-delete').addEventListener('click', async () => {
          if (confirm(`Are you sure you want to delete "${data.title}"?`)) {
            await deleteDoc(doc(db, 'hymns', hymnDoc.id));
          }
        });

        adminHymnList.appendChild(item);
      });
    });
  </script>
</body>
</html>
