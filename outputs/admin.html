<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LFC Aare | Book Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--ink:#10221d;--forest:#124b3a;--lime:#d3ff67;--paper:#f7f5ef;--line:rgba(16,34,29,.2)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",sans-serif}.wrap{width:min(680px,calc(100% - 40px));margin:0 auto;padding:70px 0}.eyebrow{font:500 .7rem "DM Mono",monospace;text-transform:uppercase;letter-spacing:.1em;color:#217754}h1{margin:14px 0;font:600 clamp(2.5rem,7vw,4.2rem)/.95 "Playfair Display",serif;letter-spacing:-.06em}p{line-height:1.55;color:#40574f}.panel{margin-top:35px;padding:28px;background:#fff;border:1px solid var(--line)}.hidden{display:none}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font:500 .67rem "DM Mono",monospace;text-transform:uppercase;letter-spacing:.08em}input{font:400 .92rem "DM Sans",sans-serif;padding:11px;border:1px solid var(--line)}button{margin-top:19px;padding:14px 18px;border:0;background:var(--ink);color:#fff;font:700 .88rem "DM Sans",sans-serif;cursor:pointer}button:hover{background:var(--forest)}.status{min-height:24px;margin:14px 0 0;font-size:.86rem}.error{color:#a42716}.success{color:#16734b}.topline{display:flex;justify-content:space-between;gap:15px;align-items:center}.logout{margin:0;background:transparent;color:var(--forest);border:1px solid var(--forest)}.hint{font-size:.79rem;color:#607069}@media(max-width:520px){.wrap{width:min(100% - 30px,680px);padding-top:40px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">LFC Aare Church</div><h1>Book Manager</h1><p>Publish a new Book of the Month for the church website.</p>
    <section class="panel" id="loginPanel"><form id="loginForm"><div class="form-grid"><div class="field full"><label for="loginEmail">Studio email</label><input id="loginEmail" type="email" required autocomplete="email" /></div><div class="field full"><label for="loginPassword">Password</label><input id="loginPassword" type="password" required autocomplete="current-password" /></div></div><button type="submit">Sign in</button><p class="status" id="loginStatus"></p></form></section>
    <section class="panel hidden" id="uploadPanel"><div class="topline"><strong>Signed in as studio administrator</strong><button type="button" class="logout" id="logoutButton">Sign out</button></div><form id="bookForm"><div class="form-grid"><div class="field"><label for="bookTitle">Book title</label><input id="bookTitle" required /></div><div class="field"><label for="bookAuthor">Author</label><input id="bookAuthor" value="David O. Oyedepo" required /></div><div class="field full"><label for="coverFile">Cover image</label><input id="coverFile" type="file" accept="image/png,image/jpeg,image/webp" required /></div><div class="field full"><label for="pdfFile">Book PDF</label><input id="pdfFile" type="file" accept="application/pdf" required /></div></div><button type="submit">Publish book</button><p class="status" id="uploadStatus"></p><p class="hint">Use an image under 5 MB and a PDF you are authorized to share.</p></form></section>
  </main>
  <script type="module">
    import { firebaseConfig, adminEmails } from './firebase-config.js';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getFirestore, addDoc, collection, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
    import { getStorage, ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';
    const loginPanel = document.getElementById('loginPanel'), uploadPanel = document.getElementById('uploadPanel'), loginStatus = document.getElementById('loginStatus'), uploadStatus = document.getElementById('uploadStatus');
    let auth, db, storage;
    try { const app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app); storage = getStorage(app); } catch (error) { loginStatus.textContent = 'Add your Firebase configuration in firebase-config.js before signing in.'; loginStatus.className = 'status error'; }
    onAuthStateChanged(auth, user => { const permitted = user && adminEmails.includes(user.email); loginPanel.classList.toggle('hidden', !!permitted); uploadPanel.classList.toggle('hidden', !permitted); if (user && !permitted) { signOut(auth); loginStatus.textContent = 'This account is not permitted to manage books.'; loginStatus.className = 'status error'; } });
    document.getElementById('loginForm').addEventListener('submit', async event => { event.preventDefault(); loginStatus.textContent = 'Signing in...'; const email = document.getElementById('loginEmail').value, password = document.getElementById('loginPassword').value; try { await signInWithEmailAndPassword(auth, email, password); } catch (error) { loginStatus.textContent = 'Sign-in failed. Check your email, password and Firebase setup.'; loginStatus.className = 'status error'; } });
    document.getElementById('logoutButton').addEventListener('click', () => signOut(auth));
    document.getElementById('bookForm').addEventListener('submit', async event => { event.preventDefault(); const title = document.getElementById('bookTitle').value.trim(), author = document.getElementById('bookAuthor').value.trim(), cover = document.getElementById('coverFile').files[0], pdf = document.getElementById('pdfFile').files[0]; if (!cover || !pdf) return; uploadStatus.textContent = 'Uploading book files...'; uploadStatus.className = 'status'; try { const key = Date.now() + '-' + title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); const [coverUpload, pdfUpload] = await Promise.all([uploadBytes(ref(storage, `books/${key}/cover-${cover.name}`), cover), uploadBytes(ref(storage, `books/${key}/book-${pdf.name}`), pdf)]); const [coverUrl, pdfUrl] = await Promise.all([getDownloadURL(coverUpload.ref), getDownloadURL(pdfUpload.ref)]); await addDoc(collection(db, 'books'), { title, author, coverUrl, pdfUrl, createdAt: serverTimestamp() }); event.currentTarget.reset(); document.getElementById('bookAuthor').value = 'David O. Oyedepo'; uploadStatus.textContent = 'Published successfully. It is now visible on the website.'; uploadStatus.className = 'status success'; } catch (error) { uploadStatus.textContent = 'Upload failed. Check Firebase configuration and security rules.'; uploadStatus.className = 'status error'; } });
  </script>
</body>
</html>
